<body>
<div id="app">
  <header class="topbar">
    <div class="topbar-side topbar-side-left">
      <div class="brand" id="brandHome" title="回到首頁">
        <div class="brand-mark">
          <img src="assets/brand-icon.png" alt="劍玉招式庫" />

    <!-- Search panel: slides out from the top-left (v0.5: text / #tag + grip / part conditions + live results). -->
    <div class="search-panel" id="searchPanel">
      <div class="search-wrap">
        <svg viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M21 21l-4.3-4.3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input type="text" class="search-input" id="searchInput" placeholder="搜尋招式名稱，或輸入 #標籤…" autocomplete="off" />

          <svg viewBox="0 0 24 24" width="12" height="12" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="search-tag-suggest drawer-chip-row" id="searchTagSuggest"></div>
      <div class="search-section">
        <div class="search-label-row">
          <div class="lang-switch search-seg-sm" id="searchGripRow"></div>
          <div class="lang-switch search-seg-sm" id="searchPartsMode"></div>
        </div>
        <div class="drawer-chip-row" id="searchPartsRow"></div>

        <button type="button" class="icon-btn" id="settingsBtn" title="設定"></button>
      </div>
    </div>
  </header>

  <!-- 總表更新通知：只有目前釘選的版本落後於已發布的最新版本時才會顯示，
       點擊「立即更新」才會把畫面換成最新版（不會自動套用，也不會動到使用者
       自己新增/修改/刪除過的項目 — 見 js/19-auth-sync.js 的 SHARED BASE 說明）。 -->

<!-- Settings Modal (js/14-shell-settings.js; account, theme, language, coming-soon entries) -->
<div class="modal-overlay" id="settingsOverlay">
  <div class="modal modal-lg settings-modal" id="settingsModal">
    <div class="settings-head">
      <div class="modal-title" id="settingsTitle">設定</div>
      <button type="button" class="btn btn-ghost btn-sm settings-admin-btn" id="settingsAdminBtn" hidden></button>
      <button type="button" class="icon-btn settings-close" id="settingsCloseBtn"></button>
    </div>
    <div class="modal-scroll settings-body">
      <!-- Row 1: account (id authWidget kept: js/50-sync-core.js toggles .syncing on it) -->
      <div class="settings-row auth-widget" id="authWidget">
        <button type="button" class="btn btn-primary" id="authLoginBtn">使用 Gmail 登入</button>
        <div class="auth-user" id="authUserWidget" hidden>
          <div class="auth-menu-account" id="authMenuAccount">
            <span class="auth-menu-avatar-wrap">
              <img class="auth-menu-avatar-img" id="authMenuAvatarImg" src="" alt="" hidden />
              <span class="auth-menu-avatar-fallback" id="authMenuAvatarFallback"></span>
            </span>
            <span class="auth-menu-account-text">
              <span class="auth-menu-name-row">
                <span class="auth-menu-name" id="authMenuName"></span>
                <button type="button" class="auth-menu-edit-btn" id="authMenuEditBtn" title="編輯暱稱" aria-label="編輯暱稱">
                  <svg viewBox="0 0 24 24" fill="none"><path d="M4 20h4L18.5 9.5a2.121 2.121 0 00-3-3L5 17v3z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </button>
              </span>
              <span class="auth-menu-email" id="authMenuEmail"></span>
            </span>
          </div>
          <div class="auth-menu-name-edit" id="authMenuNameEdit" hidden>
            <input type="text" class="auth-menu-name-input" id="authMenuNameInput" maxlength="24" />
            <div class="auth-menu-name-edit-actions">
              <button type="button" class="auth-menu-name-cancel" id="authMenuNameCancel">取消</button>
              <button type="button" class="auth-menu-name-save" id="authMenuNameSave">儲存</button>
            </div>
          </div>
          <div class="auth-menu-sync" id="authMenuSync">
            <span class="auth-menu-sync-text" id="authMenuSyncText"></span>
            <button type="button" class="auth-menu-edit-btn auth-menu-sync-btn" id="authMenuSyncBtn" title="立即同步" aria-label="立即同步">
              <svg viewBox="0 0 24 24" fill="none"><path d="M20 12a8 8 0 01-13.7 5.6M4 12a8 8 0 0113.7-5.6M18 3v4h-4M6 21v-4h4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>
          <div class="settings-account-actions">
            <button type="button" class="btn btn-ghost btn-sm" id="authLogoutBtn">登出</button>
          </div>
        </div>
      </div>

      <!-- Row 2: theme (left) + language (right) -->
      <div class="settings-row settings-pair">
        <div class="lang-switch" id="themeSwitch">
          <button type="button" class="theme-btn" data-theme-pref="system">◐</button>
          <button type="button" class="theme-btn" data-theme-pref="dark">☾</button>
          <button type="button" class="theme-btn" data-theme-pref="light">☀</button>
        </div>
        <div class="lang-switch" id="langSwitch">
          <button type="button" class="lang-btn" data-lang="zh">TW</button>
          <button type="button" class="lang-btn" data-lang="jp">JP</button>
          <button type="button" class="lang-btn" data-lang="en">EN</button>
        </div>
      </div>

      <!-- Rows 3-5: guide, notices, forms, install, privacy -->
      <div class="settings-grid">
        <button type="button" class="settings-item" id="settingsGuideBtn">
          <span class="settings-item-label" id="settingsGuideLabel">快速導覽</span>
        </button>
        <button type="button" class="settings-item" id="settingsNoticesBtn">
          <span class="settings-item-label" id="settingsNoticesLabel">通知與近期更新</span>
        </button>
        <button type="button" class="settings-item" disabled>
          <span class="settings-item-label" id="settingsSubmitLabel">招式投稿／申請協助者</span>
          <span class="settings-item-note" id="settingsSubmitNote">欲大量投稿可申請成為協助者</span>
          <span class="settings-soon" data-soon>即將推出</span>
        </button>
        <button type="button" class="settings-item" disabled>
          <span class="settings-item-label" id="settingsReportLabel">問題回報</span>
          <span class="settings-soon" data-soon>即將推出</span>
        </button>
        <!-- Row 5: install app (js/17-shell-pwa.js) + privacy (js/14-shell-settings.js) -->
        <button type="button" class="settings-item" id="settingsInstallBtn">
          <span class="settings-item-label" id="settingsInstallLabel">安裝 App</span>
          <span class="settings-item-note" id="settingsInstallNote"></span>
        </button>
        <button type="button" class="settings-item" id="settingsPrivacyBtn">
          <span class="settings-item-label" id="settingsPrivacyLabel">隱私說明</span>
        </button>
      </div>
      <div class="settings-privacy" id="settingsPrivacyText" hidden></div>
    </div>
  </div>
  <div class="settings-credit">Designed by <a href="https://www.instagram.com/cookie_yu_1031/" target="_blank" rel="noopener noreferrer">@cookie_yu_1031</a></div>
</div>

<!-- Updates page (js/16-shell-updates.js) -->
<div class="modal-overlay" id="updatesOverlay">
  <div class="modal modal-lg" id="updatesModal">
    <div class="settings-head">
      <div class="modal-title" id="updatesTitle">通知與近期更新</div>
      <button type="button" class="icon-btn settings-close" id="updatesCloseBtn"></button>

</div>

<!-- Admin panel (js/70-admin-panel.js; admin only, opened from settings) -->
<div class="modal-overlay" id="adminOverlay">
  <div class="modal modal-lg admin-modal" id="adminModal">
    <div class="settings-head">
      <div class="modal-title" id="adminTitle">管理員面板</div>
      <button type="button" class="icon-btn settings-close" id="adminCloseBtn"></button>
    </div>
    <div class="modal-scroll admin-grid">
      <section class="admin-card admin-area-stats">
        <div class="admin-card-head">
          <div class="admin-card-title" id="adminStatsTitle">網站統計</div>
          <button type="button" class="stats-refresh" id="adminStatsRefresh">↺</button>
        </div>
        <div class="admin-stats-body" id="adminStatsBody"></div>
      </section>
      <div class="admin-right">
      <div class="admin-actions">
        <button type="button" class="btn btn-ghost btn-sm" id="adminMailboxBtn">📫 郵件箱</button>
        <button type="button" class="btn btn-ghost btn-sm" id="adminBackupBtn">過往版本與備份</button>
        <button type="button" class="btn btn-ghost btn-sm" id="adminHelpersBtn">管理協助者</button>
      </div>
      <section class="admin-card admin-area-publish">
        <div class="admin-card-title" id="adminPublishTitle">更新與發布</div>
        <div class="admin-last"><span id="adminLastLabel">上次版本</span><span class="admin-last-value" id="adminLastValue"></span></div>
        <div class="field">
          <label for="adminVersion" id="adminVersionLbl">版本號</label>
          <input type="text" id="adminVersion" maxlength="32" autocomplete="off">
        </div>
        <div class="field">
          <label for="adminNote" id="adminNoteLbl">更新備註 <span class="req">*</span></label>
          <textarea id="adminNote" rows="3"></textarea>
        </div>
        <div class="admin-card-subtitle" id="adminPendingTitle">待發布的變更</div>
        <div class="admin-pending" id="adminPending"></div>
        <button type="button" class="btn btn-primary btn-block" id="adminPublishBtn">發布更新</button>
        <div class="field-hint admin-index-hint"><span id="adminIndexHint"></span><a id="adminIndexLink" href="https://github.com/CookieYu1031/kendama-tricks-db/actions/workflows/search-index.yml" target="_blank" rel="noopener">更新搜尋索引</a></div>
      </section>
      </div>
    </div>
  </div>
</div>

<!-- Category Modal -->
<div class="modal-overlay" id="categoryModalOverlay">
  <div class="modal" id="categoryModal">
    <div class="modal-scroll">
      <div class="modal-title" id="categoryModalTitle">新增分類</div>
      <div class="field">
        <label id="iconColorFieldLabel">圖示與顏色</label>
        <button type="button" class="icon-color-preview" id="iconColorPreviewBtn">
          <span class="icon-color-swatch" id="iconColorSwatch"></span>
          <span id="iconColorPreviewText">選擇圖示與顏色</span>
        </button>
      </div>
      <div class="field">
        <label id="categoryNameZhLabel">中文名稱 <span class="req">*</span></label>
        <input type="text" id="catZh" placeholder="例如：皿系" />
      </div>
      <div class="field">
        <label id="categoryNameJpLabel">日文名稱</label>
        <input type="text" id="catJp" placeholder="例如：皿系（さらけい）" />
      </div>
      <div class="field">
        <label id="categoryNameEnLabel">英文名稱</label>
        <input type="text" id="catEn" placeholder="e.g. Cup Tricks" />
      </div>
      <div class="form-error" id="categoryFormError">請至少輸入中文名稱</div>
    </div>
    <div class="modal-footer">
      <div class="modal-actions-split">
        <button class="btn btn-danger" id="catDeleteBtn" hidden>刪除分類</button>
        <div style="display:flex; gap:10px; flex:1; justify-content:flex-end;">
          <button class="btn btn-ghost" id="catCancelBtn">取消</button>
          <button class="btn btn-primary" id="catSaveBtn">儲存</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Icon & Color Picker Modal -->
<div class="modal-overlay" id="iconPickerOverlay">
  <div class="modal modal-lg" id="iconPickerModal">
    <div class="modal-scroll">
      <div class="modal-title" id="iconPickerTitle">選擇圖示與顏色</div>

        <label id="colorPickerLabel">顏色</label>

<!-- Media Modal (video only — notes are now edited directly in the drawer) -->

</div>

        <div class="field">
          <label id="spaceNameJpLabel">日文名稱</label>

        <div class="field">
          <label id="spaceNameEnLabel">英文名稱</label>
          <input type="text" id="spaceEn" />

          <div class="field">

            <input type="text" id="infoJp" />
          </div>
          <div class="field">
