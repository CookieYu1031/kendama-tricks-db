name: Update search index

# Manual only: run after publishing a new shared base version.
on:
  workflow_dispatch:

concurrency:
  group: firebase-deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build data/search-index.json from Firestore
        run: node scripts/build-search-index.js

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- data/search-index.json; then
            echo "Search index unchanged"
            exit 0
          fi
          VERSION=$(node -p 'require("./data/search-index.json").version')
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/search-index.json
          git commit -m "chore(search): update search index v${VERSION}"
          git push origin HEAD:main

      - name: Run local tests
        run: node --test "tests/*.test.js"

      # GITHUB_TOKEN pushes do not trigger deploy.yml, so deploy Hosting here (never rules).
      - name: Deploy hosting
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$FIREBASE_SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx --yes firebase-tools@15 deploy --only hosting --project kendama-tricks-db --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"
