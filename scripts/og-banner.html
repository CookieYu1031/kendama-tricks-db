<!doctype html>
<!-- Source of assets/og-banner.png (1200x630 social share image).
     Rebuild: scripts/build-og-banner.sh -->
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  html,body{ margin:0; width:1200px; height:630px; overflow:hidden; }
  body{
    background:
      radial-gradient(800px 500px at 82% 18%, rgba(62,155,224,0.22), transparent 60%),
      radial-gradient(700px 500px at 10% 100%, rgba(125,216,255,0.10), transparent 60%),
      #121212;
    color:#F0EDE6; font-family:'Zen Maru Gothic', sans-serif;
    display:flex; align-items:center; gap:64px; padding:0 96px; box-sizing:border-box;
  }
  .icon{ width:260px; height:260px; border-radius:56px; flex:0 0 auto;
    background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.16);
    box-shadow: inset 0 1.5px 0 rgba(255,255,255,0.35), 0 30px 60px -30px rgba(0,0,0,0.8);
    display:flex; align-items:center; justify-content:center; }
  .icon img{ width:200px; height:200px; object-fit:contain; }
  h1{ margin:0; font-size:92px; font-weight:900; line-height:1.02; letter-spacing:-1px; }
  h1 span{ color:#7DD8FF; }
  .zh{ margin-top:22px; font-size:40px; font-weight:700; color:rgba(240,237,230,0.62); letter-spacing:4px; }
  .url{ margin-top:34px; font-size:26px; font-weight:500; color:rgba(240,237,230,0.36); }
</style></head>
<body>
  <div class="icon"><img src="../assets/brand-icon.png" alt=""></div>
  <div>
    <h1>Kendama<br>Tricks <span>DB</span></h1>
    <div class="zh">劍玉招式庫</div>
    <div class="url">kendama-tricks-db.web.app</div>
  </div>
</body></html>
